name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + type-check + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src/ tests/

      - name: Mypy (strict)
        run: mypy src/

      - name: Pytest
        run: pytest -q
