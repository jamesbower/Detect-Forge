[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detect-forge"
version = "0.1.0"
description = "AI Native Detection engineering toolkit. One install, one config, one CI step."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "James Bower" }]
keywords = [
    "detection-engineering",
    "sigma",
    "elastic",
    "mitre-attack",
    "security",
    "ci",
    "backtest",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "mitreattack-python>=3.0",
    "requests>=2.31",
    "pySigma>=0.10",
    "pyyaml>=6",
    "jinja2>=3.1",
    "fastembed>=0.4",
    "openai>=1.40",
    "eql>=0.9",
]

[project.urls]
Homepage = "https://github.com/jamesbower/Detect-Forge"
Repository = "https://github.com/jamesbower/Detect-Forge"
Issues = "https://github.com/jamesbower/Detect-Forge/issues"

[project.scripts]
detect-forge = "detect_forge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "requests-mock>=1.11",
    "mypy>=1.8",
    "ruff>=0.3",
    "types-requests>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["src/detect_forge"]
include = [
    "src/detect_forge/py.typed",
    "src/detect_forge/audit/templates/*",
    "src/detect_forge/backtest/corpus_data/*.json",
    "src/detect_forge/backtest/templates/*",
    "src/detect_forge/coverage/priority_data/*.json",
    "src/detect_forge/coverage/templates/*",
    "src/detect_forge/stale/prompts/*",
    "src/detect_forge/stale/templates/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["mitreattack.*", "sigma.*", "requests_mock.*", "fastembed.*", "openai.*", "yaml.*", "eql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that hit real services or download real models (skipped by default; opt-in via `pytest -m integration`)",
]
